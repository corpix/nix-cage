name: test
on:
  pull_request:
  push:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: nix
    strategy:
      matrix:
        arch: [x86_64-linux]
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
    steps:
      - name: git config
        run: |
          git config --global url.'https://git.tatikoma.dev'.insteadOf 'ssh://gitea@git.tatikoma.dev:2222'
      - name: checkout
        uses: https://git.tatikoma.dev/corpix/checkout-action@v3
        with:
          fetch-depth: 10
      - name: test
        run: nix develop .#devShells.${{ matrix.arch }}.default --command make test
